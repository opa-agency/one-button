services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onebutton}
      POSTGRES_USER: ${POSTGRES_USER:-onebutton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onebutton}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
        DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-onebutton}:${POSTGRES_PASSWORD:-onebutton}@db:5432/${POSTGRES_DB:-onebutton}}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-600}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
